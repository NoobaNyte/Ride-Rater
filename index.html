<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
	<title>Ride Rater</title>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			background-color: #1f3b7d;
			overflow: hidden;
			touch-action: none;
		}

		/* The canvas where Godot draws the game */
		#canvas {
			display: block;
			width: 100%;
			height: 100%;
			position: absolute;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			outline: none;
			border: none;
			-webkit-tap-highlight-color: transparent;
			z-index: 1;
		}

		/* The custom loading screen overlay */
		#boot-screen {
			position: absolute;
			top: 0;
			left: 0;
			width: 100vw;
			height: 100vh;
			z-index: 10;
			display: flex;
			justify-content: center;
			align-items: center;
			
			/* Background Image Setup */
			background-image: url('assets/background.png'); /* REPLACE WITH YOUR BACKGROUND PATH */
			background-size: cover;
			background-position: center;
			background-repeat: no-repeat;
			transition: opacity 0.4s ease;
		}

		/* Container to push the logo and bar up slightly above center */
		.ui-container {
			display: flex;
			flex-direction: column;
			align-items: center;
			margin-top: -20vh;
		}

		#logo {
			max-width: 80vw;
			width: 350px;
			margin-bottom: 25px;
			filter: drop-shadow(0px 6px 4px rgba(0, 0, 0, 0.4));
		}

		/* Progress Bar Container */
		#progress-container {
			width: 300px;
			max-width: 75vw;
			height: 32px;
			background-color: #ff8400; /* Orange background */
			border: 6px solid #1f3b7d; /* Blue stroke */
			border-radius: 45px;
			box-shadow: 0px 8px 6px rgba(0, 0, 0, 0.3); /* Drop shadow */
			position: relative;
			overflow: hidden; /* Keeps the yellow fill inside the rounded corners */
		}

		/* Progress Bar Fill */
		#progress-fill {
			height: 100%;
			width: 0%;
			background-color: #ffdc4f; /* Yellow fill */
			border-radius: 12px;
			transition: width 0.1s linear;
		}
	</style>
	<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
	<canvas id="canvas"></canvas>

	<div id="boot-screen">
		<div class="ui-container">
			<!-- REPLACE WITH YOUR LOGO PATH -->
			<img id="logo" src="assets/logo.png" alt="Logo">
			
			<div id="progress-container">
				<div id="progress-fill"></div>
			</div>
		</div>
	</div>

	<script src="index.js"></script>
	<script>
		const engine = new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":22109664,"index.wasm":38542967},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});
		const bootScreen = document.getElementById('boot-screen');
		const progressFill = document.getElementById('progress-fill');

		engine.startGame({
			'onProgress': function (current, total) {
				if (total > 0) {
					progressFill.style.width = `${(current / total) * 100}%`;
				} else {
					progressFill.style.width = `${current * 100}%`;
				}
			}
		}).then(() => {
			// Fade out the boot screen once the game starts
			bootScreen.style.opacity = '0';
			setTimeout(() => {
				bootScreen.style.display = 'none';
			}, 400); // Wait for the fade transition to finish
		});
	</script>
</body>
</html>
